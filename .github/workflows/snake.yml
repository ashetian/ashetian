name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # her 12 saatte bir (tam saatlerde)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github&color_snake=%2300bcd4&color_dots=%23d0f0d0,%23a6e3a1,%2376c776,%234da44c,%232c8c2c,%231f6f1f
            dist/snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%231a1f2b,%2326373f,%233a6f55,%234da44c,%2370c05a,%2390d96b

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
